name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build HostTriangle APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Build Release and Debug APKs
        run: ./gradlew assembleRelease assembleDebug -x lintVitalRelease -x lintVitalReportRelease

      - name: Verify Generated APKs
        run: |
          echo "Listing generated APKs:"
          ls -lh app/build/outputs/apk/release/
          ls -lh app/build/outputs/apk/debug/

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HostTriangle-APKs
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: HostTriangle ${{ github.ref_name }} (Pre-release)
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          prerelease: true
          generate_release_notes: true
